# Nav2 on the Banana Pi. Skid-steer differential drive, measured at 0.33 m/s at
# the slowest PWM its motors will turn at and 0.68 m/s at PWM 140, a 2D lidar, and
# four Cortex-A53 cores that are already running slam_toolbox.
#
# Two decisions shape everything here.
#
# **There is no AMCL and no map_server.** Those localise a rover against a map
# somebody saved earlier, and this rover is mapping as it goes -- slam_toolbox is
# already publishing `map` -> `odom`, which is the same transform AMCL would
# publish and the only thing Nav2 wants from either. Running them as well would
# put two things in charge of one transform, which is the classic way to get a
# robot that teleports.
#
# **The controller is DWB at 10 Hz, not MPPI at 20.** MPPI is the better
# controller and it rolls out thousands of trajectories per tick; on this board
# that is the whole CPU budget for a rover that also has to map. DWB with modest
# sampling costs a fraction of it and still avoids things the planner did not know
# about, which pure pursuit does not. 10 Hz rather than 20 because 0.5 m/s is 5 cm
# per tick, and a rover that replans every 5 cm is not the one that hits anything.
# If the rover feels sluggish to react, raise the frequency before reaching for a
# bigger controller.
#
# **The speeds here are not the constants in lidar_slam/nav_types.py.** Those were
# measured on the rover as it was, on a different board and floor, and they are
# wrong in a way that matters: MAX_SPEED_MS says 0.35 m/s, which is very nearly
# this chassis's *minimum*. Put it here and every command lands on the slowest PWM
# the motors will turn at, with no speed control at all. What is here comes from
# ros_nav/calibrate_chassis.py, which measured this rover. The chassis width does
# still come from nav_types.py -- the rover has not changed shape.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # **200 ms rather than the stock 20, and the stock was failing a quarter of
    # all navigation goals outright.**
    #
    # This is how long a behaviour tree action node waits for a server to say
    # "accepted" before it gives up and fails the action -- not how long the
    # work may take, just the acknowledgement. When it fires the log says
    # `Timed out while waiting for action server to acknowledge goal request
    # for compute_path_to_pose` and the goal is abandoned before the planner
    # has been asked anything, so it reads as a navigation failure and is a
    # scheduling one.
    #
    # Measured on the board with acklat.py, forty goal requests to the live
    # planner while the rover stood still: median 13.9 ms, p90 29 ms, max
    # 35 ms. The stock 20 ms sits below the median. Twenty-five per cent of
    # those forty would have been failed by it, and the log agrees -- three of
    # the seventeen goals in the preceding half hour died exactly that way.
    # Four cores here run slam_toolbox, seven Nav2 servers and three Python
    # nodes, and load average sits near eight; 20 ms is not a deadline this
    # board can meet.
    #
    # 200 ms is roughly six times the worst sample and fourteen times the
    # median, which leaves room for a busier moment than the one measured. It
    # is deliberately not the whole second it would be tempting to use: this
    # wait blocks the tree tick, so it is also how long a cancel can sit
    # unheard. If the message comes back, this is the number to raise.
    default_server_timeout: 200
    # 30 s, against a stock 1 s. This board takes visibly longer to bring a
    # behaviour tree node up, and a timeout that fires during startup looks like
    # a navigation failure.
    wait_for_service_timeout: 30000

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # **`PoseProgressChecker`, not `SimpleProgressChecker`, and the difference
      # is the whole reason a rover on a perfectly good route got called stuck.**
      #
      # `SimpleProgressChecker` measures one thing: how far the rover has moved.
      # On a chassis that steers by driving one track faster than the other, that
      # is a fair test. On this one it is not, because this one changes direction
      # by stopping and pivoting -- `vx_samples: 2` below means every heading
      # change larger than a 0.5 m arc can absorb *is* a turn on the spot -- and a
      # turn on the spot moves the rover nowhere at all. So the check cannot tell
      # a rover pivoting to line up on the next leg of its route from a rover
      # jammed against a chair leg.
      #
      # Recorded here: a goal 2.95 m away with a wall in between planned as a
      # correct 8.81 m route that set off 91 degrees off the nose. The rover
      # turned, which is what it should have done, and fifteen seconds of that
      # tripped this check three times over; each failure aborted `follow_path`,
      # cleared a costmap that had nothing wrong with it, and threw away the
      # controller's oscillation and goal state, so the replan came back the other
      # way round the wall and the rover turned back. That is the wiggle somebody
      # watched it do until the move ran out of time.
      #
      # This plugin accepts *either* 10 cm of travel or a real turn as progress,
      # which is the honest definition on this chassis.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      # 20 degrees, and the floor under it is the gyro rather than the chassis.
      # `base_node.debias` corrects a standing bias of about +0.43 deg/s, which
      # over this fifteen-second window is still six and a half degrees of pure
      # invention if the correction were ever to lapse -- so the threshold has to
      # sit well clear of it or a rover standing perfectly still would report
      # progress for ever. Three times the bias, and 1.7 s of the slowest pivot
      # this chassis can hold, so no real turn misses it.
      required_movement_angle: 0.35
      # 10 cm or 20 degrees in 15 s. Generous, because this chassis is tracked and
      # skids: a tight check calls a rover that is grinding round a tight corner
      # "stuck" and triggers a recovery that makes it worse.
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # **22 cm, and it is the chassis that sets it, not the map.** The pose
      # comes from a 5 cm grid and a scan matcher, so anything under about 10 cm
      # would be asking the rover to hunt for a precision the map does not
      # contain. The reason it is twice that is the speed floor: one forward
      # sample at 0.40 m/s over a 0.8 s rollout means the shortest move DWB can
      # even consider is 32 cm, so a 15 cm circle is a target the controller
      # cannot aim at. Measured on the rover -- a goal that ended 23 cm out sat
      # and shuffled for 25 s and then timed out, because every rollout that
      # closed the gap overshot it and scored worse than standing still.
      #
      # 15 degrees stays. Rotation has no floor of that kind: the difference
      # between two wheels already turning is continuous. See drive_mixer.py.
      xy_goal_tolerance: 0.22
      yaw_goal_tolerance: 0.26
      stateful: true

    # **This chassis has two forward speeds: stopped, and about a third of a
    # metre a second.** Everything unusual in this block follows from that one
    # measured fact, so it is worth stating before the numbers.
    #
    # `calibrate_chassis.py` tried PWM 70 and PWM 80 and neither moved the rover
    # at all; the slowest speed it can hold is 0.33 m/s at PWM 85. There is no
    # creep. A stock DWB does not know this: it samples a dozen forward speeds
    # between zero and its maximum, rolls each one out, scores it and picks one --
    # and every sample under 0.33 comes out of the wheels as 0.33. Recorded on the
    # rover over one ordinary 1.8 m drive, 16 of the 37 velocity commands Nav2
    # issued were in that band, the slowest of them 0.05 m/s against a rover
    # already doing 0.34.
    #
    # Two things follow, and both of them look like a controller that cannot
    # steer:
    #
    # - **Every acceleration and deceleration was a fiction.** DWB ramped up over
    #   0.9 s and down over 0.7 s; the rover stepped to 0.33 m/s on the first
    #   command and held it until the command reached exactly zero. So it
    #   overshot the end of every leg and had to come back for it.
    # - **Tight curves were a fiction too.** DWB believed it could pair 0.05 m/s
    #   with 0.78 rad/s, which is a 6 cm turning radius. The tightest arc this
    #   chassis can actually drive is 0.33 m/s over 0.78 rad/s, which is 0.43 m
    #   of radius -- about 0.9 m across, and close to the 0.7 m somebody measured
    #   by driving it. Asked for the tight one it drove the wide one, ran wide of
    #   the path, was corrected, and ran wide the other way.
    #
    # So the velocity space here is set to the two things the chassis can do and
    # nothing else. `vx_samples: 2` with a floor of zero means DWB samples exactly
    # {0.0, max_vel_x}: stop, or go. Anything the path asks for that a 0.5 m arc
    # cannot absorb is then a turn on the spot, which is what this chassis does
    # anyway.
    FollowPath:
      # **There was a `RotationShimController` in front of this, and it had to
      # come out.** The idea was right -- a heading change tighter than a 0.5 m
      # arc can absorb should be a turn on the spot, and that is a manoeuvre a
      # velocity controller only approximates. It does not work on this rover.
      #
      # It transforms a point off the path into the base frame with a fixed 10 ms
      # transform tolerance that it does not expose as a parameter, and the
      # transform tree here is driven by the driver board at about 17 Hz, so the
      # newest `odom -> base_link` is 30 ms old on average and the lookup fails.
      # What that costs is not just the shim: it throws, logs at ERROR, and
      # delegates, ten times a second, and with it in the chain the control loop
      # ran at 6-7 Hz against the 10 it is asked for, `compute_path_to_pose` began
      # timing out on acknowledgement, and moves were aborted mid-drive.
      #
      # Nothing was lost by removing it, because the sample set below already
      # contains the pivot: with vx running -0.40, 0.0, +0.40, "turn on the spot"
      # is one of the three things DWB can choose, and recorded off `/evaluation`
      # it chooses it about a third of the time and forward the rest.
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # The measured envelope. 0.50 m/s comes from calibrate_chassis.py, which
      # found this chassis does 0.33 m/s at the slowest PWM its motors will turn
      # at and 0.68 at PWM 140. It is *not* MAX_SPEED_MS from nav_types.py, which
      # says 0.35 and is therefore almost exactly the rover's minimum -- setting
      # that here pinned every command to the slowest PWM and left no speed
      # control whatsoever. 0.50 rather than 0.68 is a comfort setting: a house
      # has furniture in it.
      #
      # 45 deg/s is 0.785 rad/s, and that one *is* a real limit rather than a
      # comfort setting -- past it a 100 ms lidar sweep smears across more heading
      # change than a scan match can absorb.
      # **The controller may not reverse at all, and that is a sensor limit
      # rather than a comfort one.** The lidar is the only thing on this rover
      # that sees where it is going, and it is mounted looking forwards, so a
      # reverse leg is driven blind. Given a reverse sample DWB will take one
      # whenever the arithmetic happens to like it, and the arithmetic does not
      # know the rover cannot see behind itself.
      #
      # Nav2 can still back out of a corner, because that is the behaviour
      # server's `backup` recovery and the behaviour tree bounds it to 30 cm --
      # which is about the length of blind reversing worth having. The bridge
      # applies the same rule to an explicit `drive` backwards: see
      # REVERSE_LIMIT_M in nav_bridge.py, which turns the rover round rather
      # than reversing the length of a room.
      min_vel_x: 0.0
      # 0.40 rather than the 0.50 this was, and the change is not about comfort.
      # With three samples the rover drives at exactly this whenever it is
      # rolling, so it is now *the* speed rather than a ceiling -- and it has to
      # sit far enough above the 0.33 m/s floor that the mixer has PWM left to
      # steer with.
      max_vel_x: 0.40
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.78
      # **0.1 and 0.21, and both have to move or neither does anything.**
      # Nav2 drops a sample only when hypot(vx, vy) is under min_speed_xy *and*
      # |vtheta| is under min_speed_theta. A theta floor with min_speed_xy left
      # at zero is a no-op: hypot is never below zero, so the slow pivots stay.
      # 0.1 m/s sits below the only forward sample (0.40), so driving is
      # untouched; it just makes the standing-turn floor actually apply.
      #
      # 0.21 rad/s is 12 deg/s, `drive_mixer.MIN_TURN_DPS`. DWB's sixteen-way
      # split of ±0.78 includes ±0.052 and ±0.156 -- about 3 deg/s and 9 deg/s --
      # and the mixer lifts anything slower than 12 to 12, so those samples are
      # a correction the rover will not execute. Recorded 2026-08-25 in a
      # doorway Lattice had already drawn a followable path through: 192 of 256
      # pivot commands were 0.052 rad/s, eight in ten commands that minute were
      # pivots, a thousand degrees of turning for 2.6 m of travel.
      min_speed_xy: 0.1
      max_speed_xy: 0.40
      # Turning on the spot is how a skid-steer chassis changes direction, so it
      # has to be allowed rather than penalised into a wide arc it cannot drive.
      # The floor above is which standing turns are *legal*, not whether they
      # exist.
      min_speed_theta: 0.21
      # **These describe a chassis that steps, because this one does.** They are
      # not comfort limits and they are not guesses: measured on the rover, the
      # wheels were at 0.34 m/s within 0.15 s of the first command and at zero
      # within one tick of the last.
      #
      # The number that matters is the limit times the controller's period, which
      # is what DWB is allowed to change the command by in one tick -- and it
      # samples *within* that window rather than within min_vel_x..max_vel_x. At
      # the 0.5 m/s^2 that was here, the window from rest was 0 to 0.05 m/s, so
      # the fastest thing DWB could ask for on the first tick was a seventh of the
      # slowest speed the rover can hold. 4.0 m/s^2 over a 0.1 s tick is 0.40, so
      # the window is the whole range and both samples are always reachable.
      acc_lim_x: 4.0
      acc_lim_theta: 8.0
      decel_lim_x: -4.0
      decel_lim_theta: -8.0
      # **Two forward samples, and they are the two the chassis has.** With the
      # range running 0.0..0.40 and the acceleration window covering it, DWB's
      # iterator returns exactly {0.0, +0.40}: stop, or go. Twelve evenly spaced
      # samples sounds better and is worse -- ten of them were speeds the wheels
      # cannot produce, so DWB was scoring ten rollouts of a rover that does not
      # exist and picking between them.
      #
      # There were three of these until reverse came out, and nothing was lost
      # with it. Paired with the sixteen rotation samples, the "stop" sample is
      # a turn on the spot, so the pivot this chassis uses to change direction
      # is still one of the things DWB can choose -- recorded off `/evaluation`,
      # about a third of its ticks.
      #
      # The rotation samples stay dense, because steering *is* continuous here:
      # the differential between two wheels that are already turning has no
      # stiction floor, which is what `steer_pwm` is about. So the CPU cost is
      # 3 x 16 at 0.8 s -- 48 rollouts a tick where there were 240, and each of
      # them shorter. That headroom is spent on `ObstacleFootprint`, which
      # traces four edges where the critic it replaced read one cell.
      vx_samples: 2
      vy_samples: 1
      vtheta_samples: 16
      # **0.8 s, and the reason is the turning radius again.** A rollout is
      # sim_time long -- 0.6 m at 1.5 s and this speed -- and the two critics
      # that dominate the score measure how far it strays from the planned path.
      # NavFn plans on a 5 cm grid with no curvature limit in it, so its corners
      # are tighter than any arc this chassis can drive; over 0.6 m of arc the
      # best forward option was 10 points off the path while standing still was
      # 1.6, and standing still therefore won. Recorded off `/evaluation`: the
      # rover chose to stay put on 282 of 342 ticks with clear floor ahead of it.
      #
      # A shorter rollout does not make the corner followable, it just stops
      # asking the rover to commit to it: over 0.32 m the arc and the path have
      # not had room to diverge, and the next tick asks again. Cheap in safety
      # terms because this chassis stops within one tick -- about 4 cm at this
      # speed -- so the horizon is still eight times the stopping distance.
      sim_time: 0.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      # The same 0.22 as the goal checker above, and it has to be the same
      # number: this copy is what switches `RotateToGoal` on. Set lower, the
      # rover would settle its heading in a ring the checker will not accept;
      # set higher, it would start hunting the final heading while still driving.
      xy_goal_tolerance: 0.22
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      # **How far ahead the critics are allowed to look, and the fix for the
      # rover spinning in a corridor for a minute without going anywhere.**
      #
      # DWB does not steer at the goal. It hands the critics the part of the
      # plan within `min(half the local costmap, this)` of the rover and treats
      # the far end of that piece as the goal, which `GoalDist` and `GoalAlign`
      # flood outward from. `dwb_local_planner.cpp` measures it as a radius:
      #
      #     transform_end_threshold = std::min(dist_threshold, forward_prune_dist);
      #     auto transformation_end = std::find_if(transformation_begin, ...,
      #       [&](const auto & p) { return euclidean_distance(p, robot_pose.pose)
      #                                    > transform_end_threshold; });
      #
      # The `first_after_integrated_distance` call above it bounds only where
      # the *start* of the plan may be found, not the end. So the default 2.0
      # never bound against a 3 m window -- the costmap's own 1.5 m won -- and
      # a plan that turns a corner doubles back inside that circle. On
      # `recordings/trap-2026-08-25-spin.json` the piece handed to the critics
      # is a median 3.34 m of driving whose far end is 1.48 m away, and on 34
      # of 52 ticks that far end is a cell the rover's centre may not occupy:
      # round the corner and behind a wall. The flood in the installed
      # `libdwb_critics.so` runs through walls, so the critics reward the
      # straight line towards it, the obstacle critic refuses every forward
      # move that way, and pivoting costs nothing. The rover turns for ever.
      #
      # `trap_sim.py --aim` prices this against that recording, driving the
      # model from twelve starts. There is a plateau with hard edges:
      #
      #     2.0 m (as it was)   seed is a wall 34 of 52 ticks    0 of 12 escape
      #     1.2 m                              20 of 52          0 of 12
      #     1.1 m                              17 of 52          3 of 12
      #     1.0 m                               0 of 52         10 of 12
      #     0.9 m                               0 of 52          9 of 12
      #     0.7 m                               3 of 52         10 of 12
      #
      # Above 1.1 m the seed sits past the corner; below about 0.6 m it lands
      # inside the rover's own inflated ring instead. 0.9 is the middle of the
      # part where the seed is never a wall.
      #
      # Two things this is not. It is not a general number: what sets the upper
      # edge is how far this rover was from that corner, so it transfers only
      # as "aim nearer than the first bend". And it is not the whole fault --
      # the escapes clear a real lidar return by 0.20 to 0.25 m against a body
      # whose corner is 0.24 m out, so the rover gets moving without getting
      # through the 0.70 m gap cleanly. The general fix is to seed the goal
      # critics from a point the flood can reach at all.
      forward_prune_distance: 0.9
      # `ObstacleFootprint` rather than `BaseObstacle`, because the footprint is
      # now a rectangle. `BaseObstacle` scores and vetoes on the cost of the one
      # cell the robot's centre is in, which is a collision test only while the
      # inflation layer's inscribed ring is as big as the whole robot. It was,
      # and it no longer is: the ring is 0.14 m and the rear corners are 0.21 m
      # out, so a point check would let the rover reverse its corner into a wall.
      # This one traces the four edges.
      # **`PreferForward` is here because nothing else in the set says anything
      # about turning as such, and this rover would rather turn than drive.**
      #
      # **The measurement that put it here has been withdrawn, and it is left
      # in anyway.** The argument was that the four map-grid critics charge a
      # candidate `unreachable_score_` -- 2881 points after scaling -- for a
      # judged point the flood could not reach, that the charge falls on
      # driving rather than on turning at this look-ahead, and that the rover
      # was therefore being told ten times a second that going forward was
      # ruinous. No candidate is ever charged it. The flood in the installed
      # `libdwb_critics.so` is not stopped by walls
      # (`MapGridQueue::validCellToQueue` is `mov w0,#1; ret`, and nothing
      # calls `setAsObstacle`), so a critic with a seed reaches every cell of
      # its window: 0 of 8687 driving candidates and 0 of 6132 pivots over
      # recordings/trap-2026-08-25-spin.json. `corridor_sim.flood` has the
      # disassembly and `trap_sim.py --bias` is the measurement.
      #
      # What is still true is the behaviour this critic was reached for. On
      # that recording the rover turned 3038 degrees and finished 28 cm from
      # where it started, and the model -- which now agrees with its commands
      # on 84% of ticks -- chooses a pivot on 481 of the 496 ticks it can
      # score. Driving loses to turning by a median 4.6 points where both are
      # legal, and on 41% of the ticks no forward candidate is legal at all.
      # Taking this critic out would make that worse, so it stays until
      # somebody has a drive that says otherwise.
      #
      # `PreferForwardCritic::scoreTrajectory` returns `fabs(theta) *
      # theta_scale` for a forward rollout, read out of `libdwb_critics.so`, so
      # it prices turning directly and is symmetric in left and right -- it
      # cannot say *which* way to turn, only that turning is not free. That is
      # the right shape for this fault and the wrong shape for a rover that has
      # to pivot to escape, which is why the scale is small and why it was
      # regression-tested against both doorway recordings before it shipped.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      # No `getScale` override on this critic, so the number here is the number
      # that is used -- unlike ObstacleFootprint below. A full-speed pivot at
      # 0.78 rad/s costs 0.78 * 10 * this, against a PathDist spread of about
      # 1.6 points across a whole tick's candidates.
      #
      # Driven round the closed loop from eight starts in each of the three
      # recordings, medians:
      #
      #     look   PreferForward   corridor        doorway     lock-up
      #     0.325       0.0        1.31 m, 12 rev  1.00 m 8/8  0.91 m 8/8
      #     0.325       0.5        1.39 m,  5 rev  0.95 m 8/8  0.93 m 8/8
      #     0.450       0.0        0.66 m, 16 rev  0.92 m 8/8  0.91 m 8/8
      #     0.450       0.5        1.23 m, 15 rev  0.83 m 8/8  0.91 m 8/8
      #
      # **0.45 was the obvious-looking move and it is wrong.** It is where the
      # charge above falls about evenly on driving and turning, but evening
      # that up is not the objective: only four of the eight corridor starts
      # got anywhere at 0.45, against eight of eight at 0.325. Balancing a
      # penalty is not the same as removing it.
      PreferForward.scale: 0.5
      # **0.005 rather than the stock 0.02, and this is the number that decides
      # whether the rover moves at all.**
      #
      # This critic scores the costmap cost where a rollout *ends*, and a rover
      # that stays where it is ends where it already was -- in open floor, at
      # zero. Every rollout that goes anywhere ends 0.6 m further into a room,
      # which in a furnished one means somewhere inside the inflation gradient,
      # at a cost of 190 to 240. So the critic pays a standing bribe not to move,
      # and the bribe is worth about 4 points at the stock scale.
      #
      # Recorded off `/evaluation` while the rover sat still with clear floor in
      # front of it: standing scored 13.20 and the best forward trajectory 13.54,
      # of which 3.74 was this critic (then named BaseObstacle). It stood there and dithered until the move
      # timed out. Stock DWB gets away with the bribe because it has twenty
      # forward samples and the slow ones barely enter the gradient; this chassis
      # has no slow ones, so the bribe has to come down instead.
      #
      # Safety does not live in this number, and neither, it turns out, does
      # anything else. Two corrections to the paragraph above, both measured:
      #
      # **This scale is not the weight.** `ObstacleFootprintCritic` overrides
      # `getScale` as `resolution * scale_`, where the `BaseObstacleCritic` it
      # replaced inherited the plain `scale_`. So swapping the plugin divided
      # the weight on obstacle cost by twenty without changing a line of yaml,
      # and 0.005 here is really 0.00025 per unit of cost. The 3.74 points
      # recorded off `/evaluation` under the old critic was 187 x 0.02; the
      # same cell today is worth 0.05.
      #
      # **And correcting it changes nothing.** Raising this to 0.1, 0.4 and 1.0
      # -- the last being two hundred times what is here -- was run against the
      # recorded drive and moved neither the clearance the winning rollout ends
      # with (0.43 m at every value) nor how often it ends too close to pivot
      # (8% at every value). The reason given at the time was that the align
      # critics could charge a candidate 2881 points; they cannot, and the
      # honest version is smaller and still holds. Measured on
      # recordings/trap-2026-08-25-spin.json, within one tick the obstacle
      # critic separates best from worst by 1.38 points, `PathDist` by 2.40 and
      # `PathAlign` by 6.40, so this scale is arguing against critics worth
      # several times more and a change of a few hundredths in it does not
      # decide anything. `trap_sim.py --weights` is the measurement.
      #
      # A trajectory that actually reaches a lethal cell is still refused by
      # this critic whatever the scale is; 253 is a cost here and not contact.
      # **`BaseObstacle`, which is the critic a circular body takes.** It reads
      # the one cell the robot's centre is in and refuses anything that is not
      # free: `isValidCost` in `libdwb_critics.so` is a single comparison, `cmp
      # w1, #0xfc; cset w0, ls`, so a cost is valid exactly when it is 252 or
      # less and 253, 254 and 255 are all refusals.
      #
      # That is a *point* test, and a point test is a collision test only while
      # the inflation layer's inscribed ring is as big as the whole robot. With
      # the measured rectangle it was not -- the ring was 0.14 m and the corners
      # 0.21 m -- which is why `ObstacleFootprint` was here. With a `robot_radius`
      # the two are the same number by construction, so this is correct again,
      # and it is the stronger of the two: `ObstacleFootprint` refused only on
      # contact at 254, this refuses at 253, the ring itself. The controller can
      # no longer put the rover's centre inside the band at all.
      #
      # 0.02 and not the 0.005 that was here, and the two numbers are not
      # comparable. `ObstacleFootprintCritic` overrides `getScale` as `resolution
      # * scale_` while `BaseObstacleCritic` inherits the plain `scale_`, so
      # 0.005 there was really 0.00025 and 0.02 here is really 0.02. That is the
      # value the standing-bribe note above was measured at -- 187 x 0.02 = 3.74
      # points against moving -- and it is affordable only because `PreferForward`
      # now charges up to 3.9 points against standing and turning. The two
      # roughly cancel.
      BaseObstacle.scale: 0.02
      # **0.325, which is nav2's own default, and the 0.8 that was here is
      # what was trapping the rover.** The reasoning that put 0.8 here was
      # sound and the measurement under it was not, so this is worth setting
      # out properly.
      #
      # These two critics are the only ones in the set that can tell one
      # rotation from another. The other four read the costmap where a rollout
      # *ends*, and a rover turning on the spot ends in the cell it started in,
      # so they return the same number for every pivot. The align pair break
      # that tie by reading the map a little way in front of the nose instead,
      # and at 0.1 m they could not: the flood underneath is a whole number of
      # cells and a point 10 cm from the centre of rotation sweeps about two of
      # them across the entire turn range. Sixteen pivots scored 44.81 to 44.88
      # out of about 45, the rover had nothing to tell it which way to turn,
      # and it swung about one and a half times a second.
      #
      # All of that is still true, and the rest of what stood here is not.
      # **Both of the tables this comment has carried were produced by a model
      # whose flood stopped at the inflated ring, and the library's flood does
      # not stop at anything.** The first said 0.8 was needed because a nose
      # point that missed the flood was refused; the second said 0.325 was
      # needed because such a point was charged 2881 points. Neither event
      # exists: `MapGridQueue::validCellToQueue` is `mov w0,#1; ret` and
      # nothing in the library calls `setAsObstacle`, so once a critic has a
      # seed every cell of its window carries a real distance. See
      # `corridor_sim.flood`.
      #
      # With the flood corrected the look-ahead stops mattering on the drive
      # that is actually going wrong. Driven round the closed loop from twelve
      # starts on recordings/trap-2026-08-25-spin.json, on the rover's own
      # costmap and its own plan:
      #
      #     look-ahead   got somewhere   went (median)   turned (median)
      #     0.325          0 of 12         0.00 m           422 deg
      #     0.450          0 of 12         0.00 m           422 deg
      #     0.800          0 of 12         0.00 m           498 deg
      #
      # So 0.325 is kept because it is nav2's default and nothing argues it
      # away, not because it was measured to be better. What that trap is
      # really made of is in `trap_sim.py --bias`: on 41% of its ticks no
      # forward candidate is legal at all, and on the rest driving loses to
      # pivoting by a median 4.6 points, charged almost entirely by `PathAlign`
      # and `PathDist`.
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # A 3 m window at 5 cm. The lidar reaches 8 m, but the controller only
      # plans 1.5 s ahead -- half a metre at full speed -- so a wider window is
      # grid cells being cleared and inflated every tick for a region the
      # trajectories never enter.
      width: 3
      height: 3
      resolution: 0.05
      # **The rover's real shape, measured, instead of a circle nobody measured.**
      #
      # `robot_radius: 0.25` was here, and it was a guess made safe by being
      # generous: `base_link` is at the lidar rather than at the centre of the
      # chassis, the offset had never been measured, so the footprint was a circle
      # big enough to contain the rover wherever inside it the sensor sits.
      #
      # What that costs is not obvious and is very large. The radius is also the
      # *inscribed* radius, which is the distance at which the inflation layer
      # writes 253 -- and 253 is a hard obstacle to NavFn, not an expensive cell.
      # So every occupied cell in the map projected a 25 cm disc of no-go, and on
      # a real map of this house that closed 30% of the mapped floor and left only
      # 62% of it reachable from where the rover was standing. It was worse than
      # that: the rover's *own* cell read 253, so the planner could not leave the
      # start and answered `drive_to` with "there is no route to there that the
      # rover fits through" while the rover sat in the middle of a clear room.
      #
      # The measurement was already in the repository. `lidar_slam/slam2d.c` drops
      # the returns that land on the rover's own body, and the bounds it uses were
      # taken from 397 revolutions of this lidar looking at this chassis: the body
      # reaches 0.16 m behind the sensor and 0.14 m to each side of it. Forward is
      # the one direction the lidar cannot measure, because it sees past the body
      # that way, so 0.20 m is a deliberate over-estimate.
      #
      # The inscribed radius of that rectangle is its half-width, 0.14 m, which is
      # what the inflation layer now uses -- and 81% of the floor comes back.
      # `ObstacleFootprint` in the controller's critics is the other half of this
      # change and is not optional: the critic that was there checks one point at
      # the robot's centre, which is only a collision test while the inscribed
      # radius is the whole robot. This rectangle's corners are 0.21 m out.
      #
      # **And a circle now, not that rectangle, because this rover pivots.**
      # Everything above is still the honest history of the rectangle. What it is
      # not is a shape that can decide whether the rover may *turn*. The
      # inflation layer paints its hard 253 ring at the *inscribed* radius,
      # 0.14 m for that rectangle, while a turn on the spot sweeps the
      # *circumscribed* one. The ten centimetres between them are a band around
      # every wall the rover may legally drive into and then not turn out of, and
      # it was found wedged in exactly that band: 0.21 m off a wall, five
      # centimetres from a legal pose, the body fitting at five of sixteen
      # headings in this costmap and at none at all in the planner's. This
      # rover's entire control set is built around 32 in-place rotations, so
      # "may I stand here" and "may I turn here" have to be the same question,
      # and a radius is the only shape that makes them one.
      #
      # **0.20 m, which is the chassis measured with a tape rather than inferred
      # from the lidar's view of it.** The footprint above was never a
      # measurement of the body: it is `slam2d.c`'s self-return mask, where the
      # returns actually span 8.5-11.2 cm behind and 8.2-10.7 cm to each side
      # over 397 revolutions, plus about 5 cm of masking margin -- and the
      # forward 0.20 was never measured at all, because the lidar sees straight
      # past the body that way. It was the best number available and it is not
      # the right kind of number for this.
      #
      # **What the replay can and cannot say about the size.** Driven round the
      # loop for six seconds from twelve starts in each of the three recordings,
      # with each recording's costmap re-inflated at the radius under test
      # (`dwb_replay.closed_loop(..., reinflate=True)`), escapes out of 36:
      #
      #     0.050  36    rect   36    0.190  34    0.213  33
      #     0.100  36    0.150  36    0.200  33    0.230  31
      #                  0.175  35                 0.244  31
      #
      # It is monotone and a five-centimetre rover wins outright, which is the
      # whole point: the replay knows what the costmap forbids and nothing about
      # the rover hitting anything, so shrinking the body always scores better.
      # That column prices what a shape *costs*; it cannot choose one. The
      # rectangle ties a 0.150 circle there because in every map that reads the
      # ring it already is one -- only `ObstacleFootprint` ever saw its corners.
      # So 0.20 is chosen on geometry and paid for at three escapes in 36 against
      # the rectangle, which is the price of closing a trap we have watched
      # happen. 0.244 costs more and buys nothing 0.213 does not.
      #
      # If the body is ever measured properly the number to use is
      # `hypot(length/2, width/2)`, and if that comes out near 0.23-0.25 then
      # this house is too tight for a circle -- the doorway escapes fall away --
      # and the rectangle is the pragmatic choice despite the band.
      # `corridor_sim.CIRCULAR` models either.
      robot_radius: 0.200
      # Send the whole grid every time, not just the cells that changed. Stock
      # behaviour is one full costmap followed by deltas for ever, which is right
      # for a viewer that was watching from the start and useless for one that
      # joins later -- `ros2 topic echo /local_costmap/costmap` waits for a full
      # message that is never coming, and the costmap looks broken when it is
      # working. This one is 3 m square at 5 cm, so 3600 cells: cheap enough that
      # being inspectable is worth more than the bytes.
      #
      # The global costmap deliberately does *not* do this. It grows with the
      # building, and a whole floor of a house at 5 cm is a hundred kilobytes a
      # second onto the wifi link that everything else here depends on. Look at
      # slam_toolbox's /map instead, which is the same information.
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          # Best-effort, matching lidar_node's publisher. A reliable subscriber
          # against a best-effort publisher is the incompatibility that shows up
          # as "Subscription count: 1" and no data ever arriving.
          data_type: "LaserScan"
          # **A bearing that got nothing back has to clear, and by default it
          # does not.** `lidar_node` publishes an empty bin as `inf`, which is
          # the correct thing for a LaserScan to say, and about a quarter of
          # every revolution is one -- 360 bins against roughly 450 returns that
          # are not evenly spread, plus whatever the room absorbs. The projection
          # that turns a scan into points for this layer *drops* those bins
          # unless told otherwise, so a quarter of the directions around the
          # rover are never raytraced and anything ever marked in them stays
          # marked for as long as the process lives. That is how a person who
          # walked past an hour ago is still a wall.
          #
          # With this on, an infinite reading is read as "clear all the way out
          # to range_max" -- 8 m -- and since that is past `obstacle_max_range`
          # it clears without marking anything at the far end.
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # **0.45 m, and it must stay above the robot radius for a reason that
        # is not about cushioning.** With a circular body the inscribed and
        # circumscribed radii are the same number, 0.200 m, so the margin here
        # is comfortable -- but the rule below is a rule and it bites if either
        # number is ever changed.
        #
        # What sets the floor on this number is the planner. Smac checks the
        # full oriented footprint only when the cell under the robot's centre
        # is already expensive, and the threshold it uses is the inflation cost
        # at the *circumscribed* radius -- 0.200 m for this body, worth 216
        # here. `nav2_smac_planner/utils.hpp` computes that in
        # `findCircumscribedCost`, and if the inflation radius is smaller than
        # the circumscribed radius it logs an error and falls back to checking
        # the footprint at every cell, on a board that has four A53 cores and
        # no spare ones. So this is a lower bound, not a comfort setting.
        #
        # It is also what makes the gradient reach far enough to be worth
        # scoring at all: at 3.0 the cost is 251 at 0.15 m, 216 at 0.20 m, 186
        # at 0.25 m and 102 where it stops. Those were read back off the map
        # the rover built, not assumed.
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The same radius as the local costmap's -- see the long note there. Two
      # costmaps disagreeing about the shape of the robot is a planner that
      # routes through gaps the controller then refuses to drive, and this rover
      # has already been wedged by a ten-centimetre disagreement of that kind
      # between the ring it was cleared at and the circle it swept turning.
      robot_radius: 0.200
      resolution: 0.05
      track_unknown_space: true
      # **No obstacle layer here, and that is the whole reason this rover stopped
      # taking absurd routes.** It had one, and on a rover that is running SLAM
      # rather than localising against a saved map it cannot be made to work.
      #
      # The layer remembers marked cells in the `map` frame and nothing ever
      # re-registers them. slam_toolbox moves that frame every time it closes a
      # loop, which is the entire point of running it -- and when it does, the
      # static layer below follows, because it is the map, while every cell this
      # layer had marked stays where it was. Each correction therefore leaves a
      # ghost copy of every wall, a few centimetres off the real one, and the
      # ghosts only ever accumulate. Measured on this rover after 2h40m of
      # driving: 2649 lethal cells against the 1119 the map actually had, 1201 of
      # them with no obstacle within 10 cm and 523 of those sitting in cells the
      # map called open floor.
      #
      # That is not a cosmetic difference, because of how NavFn reads a costmap.
      # Anything at or above 253 -- which is every cell within the rover's own
      # radius of a lethal one -- is a hard obstacle to it, and 253 is also what
      # unexplored space is worth. So the ghosts did not make the floor
      # expensive, they made it *impassable*: 61% of the mapped free floor was
      # closed to the planner, and the routes that came back went the long way
      # round through unexplored space. A goal two metres straight ahead down an
      # unobstructed line was answered with a five-metre route and 519 degrees of
      # turning; with this layer gone the same goal plans as 2.3 m.
      #
      # Nothing is lost that this rover had. The static layer is slam_toolbox's
      # live map, republished every two seconds and re-registered by every loop
      # closure, so anything the lidar sees while the rover is moving is in the
      # global picture within a couple of seconds and in the *right place*. What
      # the global planner no longer knows about is an obstacle that appeared
      # since the last map update -- and that one belongs to the local costmap,
      # which does have an obstacle layer, is rebuilt from the live scan, and is
      # what DWB actually drives against.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox's live map, not a saved one. It republishes the whole grid
        # every map_update_interval, and subscribing transiently would miss it.
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # **SmacPlannerLattice, and the comment that used to live here was the
      # wrong half of a true fact.** This chassis *can* turn on the spot, so
      # a minimum turning radius is not a mechanical limit the way it is for
      # a car. It *is* a limit on what DWB can follow while driving: the only
      # forward sample is max_vel_x, the fastest turn is max_vel_theta, and
      # the tightest arc of those two is 0.40 / 0.78 = 0.51 m. NavFn's grid
      # search has no such number, so the path it traces around a metre-wide
      # doorway bends more in one rollout than that arc can, every forward
      # option leaves the line, and the rover pivots. Recorded: 44 to 67 deg
      # in the first 1.2 m of plan against 36 deg in 0.32 m of rollout; a
      # legal forward candidate lost to a pivot on all 617 ticks of one
      # drive, by a median 1.21 points. See docs/doorway-pivot.md.
      #
      # SimpleSmoother cannot see this. Called on the four sharpest recorded
      # corners it returned the input unchanged, because tightness is not
      # jaggedness. Hybrid-A* Dubins never draws a corner past 0.51 m either,
      # but it also cannot write a pivot, and this chassis's legal way through
      # a doorway that will not take an arc is to turn on the spot. The
      # differential control set in config/lattices/ is Nav2's own 5 cm,
      # 0.5 m sample -- 0.5 m is that envelope to a centimetre -- and it
      # includes in-place rotations. rotation_penalty stays at Nav2's 5.0 so
      # a doorway that *can* take an arc gets one; a pivot is the fallback,
      # not the shortcut. Reproduced in lattice.py on a 55 deg metre-wide
      # bend before this replaced Hybrid: the grid path's tightest 0.32 m
      # window was 45 deg, the lattice path's was 34.9, with no pivot.
      #
      # Reverse expansion is off: the lidar looks forwards, DWB has no reverse
      # sample, and a path that asked for a reverse leg would be one the
      # controller could not follow for a different reason. The filepath is
      # empty here because yaml cannot resolve a relative path; nav.launch.py
      # overlays the absolute one next to this file. `GridBased` keeps the
      # name the behaviour tree already asks for. 2 s and a 10 m heuristic
      # table because this is four A53 cores already running slam_toolbox.
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lattice_filepath: ""
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      goal_heading_mode: "DEFAULT"
      coarse_search_resolution: 1
      downsample_obstacle_heuristic: true
      use_quadratic_cost_penalty: false
      smooth_path: true
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    # Recoveries are slower than driving on purpose. A rover that is already
    # confused should not be the one moving quickly.
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    # **0.5 s rather than the stock 2, and this is the number that decides
    # whether a wedged rover ever gets out.**
    #
    # `Spin` and `BackUp` are not incremental. Each cycle they project the
    # whole remaining motion forward `cycle_frequency * simulate_ahead_time`
    # cycles, test the footprint at every projected pose, and return FAILED
    # for the entire behaviour the moment any one of them touches a lethal
    # cell. They do not move as far as they safely can and stop there. At two
    # seconds that projection is 0.5 rad/s x 1.9 s = 54 degrees for the spin
    # and 0.15 m/s x 1.9 s = 0.29 m for the reverse -- which is the whole
    # 0.30 m the behaviour tree asks for, so the check is all or nothing.
    #
    # Measured in corridor_sim.py, with a wall behind the rover: at two
    # seconds a rover with 0.09, 0.14, 0.18 or 0.23 m of room behind it backs
    # up exactly zero every time, and only once 0.29 m is clear does it move
    # at all. At half a second it takes 0.04, 0.09, 0.14 and 0.20 m of that
    # room. Reversing is the only recovery that translates -- turning on the
    # spot cannot move a body whose *centre* is what the costmap objects to --
    # so an all-or-nothing reverse is a rover with no way out, and that is the
    # lock-up: the planner refuses because the free channel does not reach it,
    # the controller refuses all thirty-three, and both recoveries report
    # "Collision Ahead" without having moved.
    #
    # The margin is still real. The check runs at `cycle_frequency`, which is
    # 10 Hz, against the true footprint on truly lethal cells, so half a
    # second is five control cycles of warning and the rover covers 7.5 mm or
    # 2.9 degrees in each. Shorter would recover a little more room -- 0.3 s
    # gets 0.07 against 0.04 -- and is not worth three cycles of notice.
    simulate_ahead_time: 0.5

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # The same numbers as the controller's, and for the same reason. This is the
    # last thing between DWB and the wheels, so a gentle limit here reinstates
    # exactly the ramp the controller was just told not to plan: the rover would
    # go on stepping to 0.33 m/s while Nav2 believed it was easing in.
    max_velocity: [0.40, 0.0, 0.78]
    # Reverse stays open here even though the controller above no longer uses
    # it. Everything the rover drives passes through this node, including the
    # behaviour server's `backup` recovery and the bridge's own short reverse,
    # and a floor of zero here would silently swallow both.
    min_velocity: [-0.40, 0.0, -0.78]
    max_accel: [4.0, 0.0, 8.0]
    max_decel: [-4.0, 0.0, -8.0]
    odom_topic: "odom"
    odom_duration: 0.1
    # Half a second of silence stops the wheels, matching base_node's own
    # CMD_TIMEOUT_S. Two layers agreeing on the same number is deliberate: the
    # smoother catches the controller stopping, and base_node catches the
    # smoother stopping.
    velocity_timeout: 0.5

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
