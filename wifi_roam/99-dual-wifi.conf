# Two radios on one subnet, and the two kernel settings that make that mean
# anything. Without them the dual-radio design does not merely degrade, it
# inverts: by default Linux answers an ARP request for any local address on any
# interface, so the standby radio would answer for the rover's service address,
# the access point it is associated with would learn that address, and the
# upstream bridge would deliver the rover's traffic to the radio that is not
# carrying it. Every failover would then be undone by the next ARP request.
#
# arp_ignore=1  reply only for addresses configured on the interface the request
#               arrived on. This is what makes moving one address between two
#               interfaces a real handover.
# arp_announce=2 use the best local address for the interface when generating an
#               ARP request, rather than whatever the packet's source happened
#               to be, so the neighbours' caches learn the right pairing.
#
# The manager sets both at startup as well. This file is what makes them true
# from boot, before it runs, and true whether or not it is running at all -- two
# radios on one LAN want these settings either way, which is also why
# `wifi_dual.py --restore` deliberately leaves them alone.
#
# rp_filter is already 0 on this board and is left alone: with per-interface
# routing tables the return path is symmetric anyway, and turning on strict
# reverse-path filtering here would be a way to drop the standby's own traffic.

net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
