<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2F5D8C; } a:hover { color: #1F4266; }
  </style>
</helmet>

<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 26px 40px 22px; background: #FCFAF6; color: #232019; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; height: 54px;">
    <div>
      <div style="font-size: 27px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1;">How the rover finds its way</div>
      <div style="font-size: 12.5px; color: #6B6355; margin-top: 4px;">A spinning laser draws a map of the room, and off-the-shelf navigation software plans a route across it and drives the wheels along it.</div>
    </div>
    <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #6B6355; text-align: right; line-height: 1.5; white-space: nowrap;">
      <div>Jetson Orin Nano &#183; ROS 2 Jazzy</div>
      <div>all of it runs on the rover itself</div>
    </div>
  </div>

  <figure style="margin: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 12px;">

    <div style="position: relative; width: 1200px; height: 556px;">

      <svg viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="The laser scanner plugs in on its own and is read directly by the navigation software; the driver board is reached over a serial cable by the program that owns the hardware. That program lends the wheels and the tilt sensor to one navigation component and takes goals back from another. The laser reading becomes a scan for the mapper and a description in words for the way in to navigation; the wheels report how far the rover has rolled; the mapper publishes the map and where the rover is on it; goals go out to Nav2 and the map and plan come back; and Nav2 finally says how fast to drive." style="position: absolute; left: 0; top: 0;">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8C8371"></path>
          </marker>
        </defs>
        <g stroke="#8C8371" stroke-width="1.4" fill="none">
          <line x1="132" y1="54" x2="444" y2="54" marker-end="url(#ar)"></line>
          <line x1="132" y1="380" x2="188" y2="380" marker-end="url(#ar)"></line>
          <line x1="360" y1="250" x2="444" y2="250" marker-start="url(#ar)" marker-end="url(#ar)"></line>
          <line x1="360" y1="470" x2="444" y2="470" marker-start="url(#ar)" marker-end="url(#ar)"></line>
          <line x1="545" y1="116" x2="545" y2="172" marker-end="url(#ar)"></line>
          <line x1="646" y1="50" x2="720" y2="50" marker-end="url(#ar)"></line>
          <path d="M646,452 H700 V76 H720" marker-end="url(#ar)"></path>
          <path d="M646,250 H690 q10,-9 20,0 H720" marker-start="url(#ar)" marker-end="url(#ar)"></path>
          <line x1="960" y1="100" x2="960" y2="140" marker-end="url(#ar)"></line>
          <path d="M720,500 H690 V520 H646" marker-end="url(#ar)"></path>
        </g>
        <g font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="9.5" fill="#6B6355">
          <text x="288" y="45" text-anchor="middle">over its own USB port</text>
          <text x="160" y="365" text-anchor="middle">serial</text>
          <text x="160" y="375" text-anchor="middle">cable</text>
          <text x="402" y="234" text-anchor="middle">goals in</text>
          <text x="402" y="245" text-anchor="middle">map out</text>
          <text x="402" y="454" text-anchor="middle">orders out</text>
          <text x="402" y="465" text-anchor="middle">counts back</text>
          <text x="555" y="136">walls and gaps</text>
          <text x="683" y="38" text-anchor="middle">the scan</text>
          <text x="692" y="150" text-anchor="end">how far the wheels</text>
          <text x="692" y="161" text-anchor="end">say it has rolled</text>
          <text x="683" y="232" text-anchor="middle">goals out</text>
          <text x="683" y="243" text-anchor="middle">plans back</text>
          <text x="950" y="114" text-anchor="end">the map, and</text>
          <text x="950" y="125" text-anchor="end">where it is on it</text>
          <text x="683" y="534" text-anchor="middle">the speed</text>
        </g>
        <text x="288" y="70" text-anchor="middle" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#8C8371">it plugs in on its own, so navigation reads it directly</text>
      </svg>

      <div style="position: absolute; left: 0px; top: 10px; width: 132px; height: 88px; box-sizing: border-box; background: #F2EFE8; border: 1px dashed #BEB6A4; border-radius: 3px; padding: 9px 10px;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 500; color: #4A443A;">the laser</div>
        <div style="font-size: 10px; line-height: 1.35; color: #6B6355; margin-top: 5px;">Spins ten times a second, measuring how far away things are.</div>
      </div>

      <div style="position: absolute; left: 0px; top: 330px; width: 132px; height: 100px; box-sizing: border-box; background: #F2EFE8; border: 1px dashed #BEB6A4; border-radius: 3px; padding: 9px 10px;">
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 500; color: #4A443A;">driver board</div>
        <div style="font-size: 10px; line-height: 1.35; color: #6B6355; margin-top: 5px;">The board that moves things: motors, wheel counters, a tilt sensor, lights, the camera head.</div>
      </div>

      <div style="position: absolute; left: 188px; top: 172px; width: 172px; height: 384px; box-sizing: border-box; background: #F2EFE8; border: 1px dashed #BEB6A4; border-radius: 3px; padding: 11px 12px; display: flex; flex-direction: column; gap: 9px;">
        <div>
          <div style="font-size: 12px; font-weight: 600; color: #4A443A;">it owns the hardware</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #8C8371; margin-top: 3px;">rover_daemon</div>
        </div>
        <div style="font-size: 10.5px; line-height: 1.4; color: #3D3A33;">Only one program can talk to the driver board at a time, and this is it &#8212; so the lights, the camera head and the battery gauge are its as well, and the voice assistant reaches for all of them through it. It cannot hand any of that over.</div>
        <div style="border-top: 1px solid #DDD6C8; padding-top: 8px; font-size: 10.5px; line-height: 1.4; color: #3D3A33;">So it lends navigation the two things it cannot do without &#8212; the wheel counters and the tilt sensor, and the motor orders &#8212; and takes goals back the other way.</div>
        <div style="margin-top: auto; font-size: 10px; line-height: 1.35; color: #6B6355; font-style: italic;">Neither connection leaves the rover. Either one reachable from the network would put the wheels behind nothing at all.</div>
      </div>

      <div style="position: absolute; left: 444px; top: 0px; width: 202px; height: 116px; box-sizing: border-box; background: #EAF0F6; border: 1px solid #9FB7CE; border-radius: 3px; padding: 9px 11px;">
        <div style="font-size: 12px; font-weight: 600; color: #2F5D8C;">reads the laser</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #8C8371; margin-top: 3px;">lidar_node</div>
        <div style="font-size: 10.5px; line-height: 1.35; color: #3D3A33; margin-top: 5px;">Passes on every revolution as a scan for the rest of the stack, and puts the same sweep into words: where the walls and the gaps are.</div>
      </div>

      <div style="position: absolute; left: 444px; top: 172px; width: 202px; height: 222px; box-sizing: border-box; background: #EAF0F6; border: 1px solid #9FB7CE; border-radius: 3px; padding: 9px 11px;">
        <div style="font-size: 12px; font-weight: 600; color: #2F5D8C;">the way in to navigation</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #8C8371; margin-top: 3px;">nav_bridge</div>
        <div style="font-size: 10.5px; line-height: 1.35; color: #3D3A33; margin-top: 5px;">Navigation lives in a world the hardware program cannot reach into directly, so this sits between the two. Ask it to go somewhere and it turns that into a navigation goal.</div>
        <div style="font-size: 10.5px; line-height: 1.35; color: #3D3A33; margin-top: 7px;">It does no steering itself; everything to the right of it does that.</div>
        <div style="font-size: 10.5px; line-height: 1.35; color: #3D3A33; margin-top: 7px;">It also keeps the map, and puts the rover back on it after a restart.</div>
      </div>

      <div style="position: absolute; left: 444px; top: 418px; width: 202px; height: 138px; box-sizing: border-box; background: #EAF0F6; border: 1px solid #9FB7CE; border-radius: 3px; padding: 9px 11px;">
        <div style="font-size: 12px; font-weight: 600; color: #2F5D8C;">turns orders into motion</div>
        <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #8C8371; margin-top: 3px;">base_node</div>
        <div style="font-size: 10.5px; line-height: 1.35; color: #3D3A33; margin-top: 5px;">One way it turns &#8220;go this fast&#8221; into power for the left and right motors. The other way it adds up wheel turns and tilt into an estimate of how far the rover has moved.</div>
      </div>

      <div style="position: absolute; left: 720px; top: 0px; width: 480px; height: 100px; box-sizing: border-box; background: #F8F0E5; border: 1px solid #D6B58A; border-radius: 3px; padding: 9px 12px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="font-size: 12px; font-weight: 600; color: #8A5215;">draws the map</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9.5px; color: #9A8B70;">slam_toolbox</div>
        </div>
        <div style="font-size: 10.5px; line-height: 1.38; color: #3D3A33; margin-top: 5px;">Lines every laser sweep up against the ones before it and builds a map out of them, five centimetres to a square, along with where the rover is standing on it. Because it recognises somewhere it has already been, a lap of the room joins up instead of drifting away from itself, and the map is written to disk as it goes.</div>
      </div>

      <div style="position: absolute; left: 720px; top: 140px; width: 480px; height: 416px; box-sizing: border-box; background: #F8F0E5; border: 1px solid #D6B58A; border-radius: 3px; padding: 14px 16px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
          <div style="font-size: 13px; font-weight: 600; color: #8A5215;">the navigation software</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9.5px; color: #9A8B70;">Nav2 &#183; every move comes from one of these</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin-top: 12px;">
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">takes the goal</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">bt_navigator</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Holds a &#8220;go there&#8221; request from beginning to end, replanning or backing out of trouble on the way.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">plans the route</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">planner_server</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Works out a path across the map, from where the rover is to where it has been asked to go.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">follows the route</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">controller_server</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Steers along that path, watching the live laser for anything that was not on the map.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">rounds the corners</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">smoother_server</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Takes the sharp turns out of the planned path before anything has to drive it.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">gets it unstuck</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">behavior_server</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Spin, back up, drive on a heading, wait. Three are ours: the stock ones refuse to move a rover that is touching something.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">drives a list</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">waypoint_follower</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Visits a series of places in order, pausing at each. Nothing on the rover asks for this yet.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">has the last word</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">velocity_smoother</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Evens out the steering and is the only thing that speaks to the wheels, so they never get two orders at once.</div>
          </div>
          <div style="background: #FDF8F1; border: 1px solid #E4CFB2; border-radius: 2px; padding: 8px 9px; height: 80px; box-sizing: border-box;">
            <div style="font-size: 10.5px; font-weight: 600; color: #8A5215;">starts the rest</div>
            <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 9px; color: #9A8B70;">lifecycle_manager &#215;2</div>
            <div style="font-size: 9.5px; line-height: 1.32; color: #3D3A33; margin-top: 4px;">Waits for each of the others to appear, then brings it up. One for these servers, one for the mapper.</div>
          </div>
        </div>
      </div>

    </div>

    <figcaption style="display: flex; align-items: center; justify-content: space-between; gap: 32px; border-top: 1px solid #DDD6C8; padding-top: 10px;">
      <div style="display: flex; align-items: center; gap: 22px; font-size: 10.5px; color: #6B6355;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <span style="width: 13px; height: 13px; background: #EAF0F6; border: 1px solid #9FB7CE; border-radius: 2px; display: inline-block; flex-shrink: 0;"></span>
          <span>written for this rover, in <span style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px;">ros_nav/</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <span style="width: 13px; height: 13px; background: #F8F0E5; border: 1px solid #D6B58A; border-radius: 2px; display: inline-block; flex-shrink: 0;"></span>
          <span>off-the-shelf software, unmodified</span>
        </div>
        <div style="display: flex; align-items: center; gap: 7px;">
          <span style="width: 13px; height: 13px; background: #F2EFE8; border: 1px dashed #BEB6A4; border-radius: 2px; display: inline-block; flex-shrink: 0;"></span>
          <span>the hardware, and the program that owns it</span>
        </div>
      </div>
      <div style="font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace; font-size: 10px; color: #8C8371; white-space: nowrap;">slam.launch.py &#183; nav.launch.py</div>
    </figcaption>

  </figure>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
