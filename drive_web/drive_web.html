<!doctype html>
<!--
  The drive console's window. Served by drive_web.py, which is what talks to the
  rover; nothing here knows a socket from a hole in the ground.

  The layout is the reason this file exists. The tkinter console it replaced put
  every panel at a fixed size and a fixed place, so the panels along the bottom --
  much of the point of the thing -- sat below the edge of a 1080p screen with no way
  to scroll to them, and a wider window only added empty space beside the camera.
  Here the panels are cards in three stacks that pack to their own contents and wrap
  when the window can no longer hold them side by side: three columns on a monitor,
  two on a laptop, one on a phone, in that order down the page. The page scrolls
  like a page.

  Stacks rather than one grid of cards, and that is not a preference. In a grid
  every card in a row is as tall as the tallest one in it, so a map eight hundred
  pixels high leaves eight hundred pixels of nothing under the driving buttons
  beside it -- the same complaint as the tkinter window, arrived at from the other
  direction.

  Two things are pinned rather than scrolled, and both are pinned for the same
  reason: the stop button and the in-flight timer are the controls you reach for
  without looking, and a stop button that has scrolled off the top of the window is
  not a stop button.

  There is no state in here. Everything on screen is drawn from the last state the
  server pushed, and every control posts an action and then waits to be told what
  happened -- so two browsers open on one rover agree with each other and with the
  room, and a button never claims a thing the rover refused.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rover drive console</title>
<link rel="stylesheet" href="/drive_web.css">
</head>
<body>

<header>
  <strong>rover</strong>
  <input type="text" id="address" size="18" placeholder="find it" autocomplete="off">
  <button id="connect">connect</button>
  <span id="link">not connected</span>
  <span class="grow"></span>
  <span id="watchers"></span>
  <span id="busy"></span>
  <button id="world">world</button>
  <button id="explore">explore</button>
  <button id="stop">STOP</button>
</header>

<div id="notice" hidden></div>

<main>
<div class="stack side">
  <section id="driveCard">
    <h2>drive</h2>
    <div class="turns-pad" id="turnPad"></div>
    <div class="row" style="margin-top:8px">
      <label for="angle">turn</label>
      <input class="num mono" type="text" id="angle" value="90">
      <span class="hint" style="margin:0">deg</span>
      <button data-move="turn">go</button>
    </div>
    <div class="row">
      <label for="distance">distance</label>
      <input class="num mono" type="text" id="distance" value="0.5">
      <span class="hint" style="margin:0">m</span>
      <button data-move="drive">go</button>
    </div>
    <div class="row">
      <label for="speed">speed</label>
      <input class="num mono" type="text" id="speed" placeholder="auto">
      <span class="hint" style="margin:0">m/s</span>
    </div>
    <div class="keys" style="margin-top:8px">
      <div><kbd>space</kbd>stop</div>
      <div><kbd>&uarr;</kbd>drive</div>
      <div><kbd>&larr;</kbd><kbd>&rarr;</kbd>turn</div>
      <div><kbd>+</kbd><kbd>&minus;</kbd>zoom</div>
    </div>
  </section>

  <section id="statusCard">
    <h2>nav_status</h2>
    <div id="statusRows"></div>
    <div id="pose" class="mono">-</div>
    <div class="row" style="margin-top:8px">
      <button id="resetLidar">reset the lidar</button>
    </div>
    <p class="hint" id="lidarNote"></p>
    <p class="hint" id="statusError"></p>
  </section>
</div>

<div class="stack hero">
  <section id="mapCard">
    <h2>map</h2>
    <div id="mapFrame">
      <div class="shot" id="mapShot">
        <img id="mapImg" alt="the rover's map" hidden>
        <span class="empty" id="mapEmpty">no map yet</span>
      </div>
      <div id="mapZoom">
        <button data-zoom="-1" title="closer">+</button>
        <button data-zoom="1" title="wider">&minus;</button>
      </div>
    </div>
    <div id="legend"></div>
    <p id="plan">-</p>
    <p id="mapNote"></p>
    <p id="mapError"></p>
    <div class="row" style="margin-top:8px">
      <label class="check"><input type="checkbox" id="roverUp"> rover up</label>
      <button id="refreshMap">refresh</button>
      <button id="describe">describe surroundings</button>
      <button id="clearMap">clear map</button>
    </div>
  </section>
</div>

<div class="stack side">
  <section id="cameraCard">
    <h2>camera</h2>
    <div class="shot" id="cameraShot">
      <img id="frameImg" alt="what the camera can see" hidden>
      <span class="empty" id="frameEmpty">no picture yet</span>
    </div>
    <p id="frameNote" class="hint"></p>
    <p id="frameError"></p>
  </section>

  <!-- The microphone, the face detector, the lamps and the battery are one card:
       four short controls that each need three lines, and four separate cards to
       hold them was mostly borders. -->
  <section id="boardCard">
    <h2>talk to it</h2>
    <div class="row">
      <button id="micButton">start talking</button>
      <span id="voiceState" class="mono">off</span>
    </div>
    <p id="voiceHeard" class="hint"></p>
    <p id="voiceSaid" class="hint"></p>
    <p id="voiceError"></p>
    <p id="voiceNote"></p>
    <details id="voiceTokenBox"><summary>token</summary>
      <div class="row">
        <input type="password" id="voiceToken" size="24" placeholder="from ~/.ugv/console.token">
        <button id="voiceTokenSave">remember</button>
      </div>
    </details>

    <h2 style="margin-top:14px">face tracking</h2>
    <div class="row">
      <button data-track="start_tracking">start</button>
      <button data-track="stop_tracking">stop</button>
      <span id="tracking" class="mono">-</span>
    </div>
    <h2 style="margin-top:14px">headlights</h2>
    <div class="row">
      <button data-light="on">on</button>
      <button data-light="off">off</button>
      <span id="lights" class="mono">-</span>
    </div>
    <!-- The lamp is the depth camera, beside the battery because that is the
         question it answers: what this rover is spending. Nobody works that
         switch any more -- the wheels do, in rover_daemon/rover_depth.py -- so
         what is left on screen is which way it went. Hidden until the rover says
         it has a depth camera and has said what it is doing. -->
    <h2 style="margin-top:14px">battery<span id="depthLamp" class="lamp" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.2 4.3 8.2 6.4H4.2a1.7 1.7 0 0 0-1.7 1.7v9.6a1.7 1.7 0
                 0 0 1.7 1.7h15.6a1.7 1.7 0 0 0 1.7-1.7V8.1a1.7 1.7 0 0
                 0-1.7-1.7h-4l-1-2.1z"/>
        <circle cx="12" cy="12.8" r="3.7"/>
      </svg></span></h2>
    <div id="battery" class="reading">-</div>
    <p id="batteryNote" class="hint"></p>
    <p id="depthNote" class="hint"></p>
  </section>

  <section id="networkCard">
    <h2>network</h2>
    <div id="wifi" class="reading">-</div>
    <p id="wifiWhere" class="hint"></p>
    <div class="scroller" style="max-height:30vh;margin-top:6px">
      <table><tbody id="wifiList"></tbody></table>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="wifiScan">look for networks</button>
    </div>
    <p id="wifiNote" class="hint"></p>
  </section>
</div>
</main>

<!-- The world-state popup. Read-only apart from the three things that act on the
     rover -- one inspection, throwing the semantic world away, and driving to a
     place a thing can be seen from -- because what this is for is deciding whether
     to believe any of it, and an editable view of an experiment's results is a
     view of the edits. -->
<div id="worldBack" hidden>
  <div id="worldBox" role="dialog" aria-modal="false" aria-label="world state">
    <div id="worldHead">
      <strong>world state</strong>
      <span id="worldCounts" class="mono"></span>
      <span class="grow"></span>
      <button id="worldInspect">inspect world</button>
      <button id="worldClose">close</button>
    </div>
    <p id="worldNote" class="hint" style="margin:6px 12px 0"></p>
    <p id="worldError" class="bad" style="margin:4px 12px 0"></p>
    <div id="worldTabs">
      <button data-wtab="entities" class="on">entities</button>
      <button data-wtab="observations">observations</button>
      <button data-wtab="diagnostics">diagnostics</button>
    </div>
    <!-- The phrase goes through the same text tower that produced every stored
         region vector, so it lands in the same space and the comparison is a dot
         product over a few hundred of them. What comes back narrows the two
         views under this box rather than filling a pane of its own: the thing a
         person is looking for is a thing in the list, on the map and in the
         stream, and a separate answer beside those was a fourth place to look
         at the same store. The slow part is the model, not the search. -->
    <div id="wFilter">
      <form id="wSearchForm">
        <input id="wSearchBox" type="search" autocomplete="off"
               placeholder="the spray bottle on the shelf"
               aria-label="describe the thing to look for">
      </form>
      <p id="wSearchNote"></p>
    </div>
    <div id="worldBody">
      <div class="wpane" id="wPaneEntities">
        <div class="wcol">
          <!-- One thing, one place, and every look drawn against it. An entity
               seen from two places far enough apart has a settled position, and
               that is drawn as the shape the crossing actually measured -- long
               down the line of sight, short across it -- with the thing's own
               width as a second ring. Each look is a sighting from where the
               rover stood, facing where it faced, and its line runs to that
               position, so a look that disagrees is a fork rather than one more
               arrow in a bundle. An entity with no position yet has only its
               bearings, which is the ordinary state of everything until the
               rover has driven far enough between two looks. -->
          <div id="wMapWrap" hidden>
            <img id="wMapImg" alt="the map">
            <svg id="wRays" preserveAspectRatio="none"></svg>
          </div>
          <p class="hint" id="wMapNote"></p>
          <div id="wList"></div>
        </div>
        <div class="wwide" id="wDetail"></div>
      </div>
      <div class="wpane" id="wPaneObservations" hidden>
        <div class="wwide" id="wObsAll">
          <p class="hint" id="wObsCount"></p>
          <div class="wtiles" id="wObsTiles"></div>
          <p class="hint" id="wObsNote"></p>
        </div>
      </div>
      <div class="wpane" id="wPaneDiagnostics" hidden>
        <div class="wwide" id="wDiag"></div>
      </div>
      <!-- One observation at full size, over the tiled stream that was clicked.
           It sits inside the body rather than over the whole popup so that the
           counts, the tabs and the stop key are all still where they were; the
           stream behind it keeps its scroll position for the same reason. -->
      <div id="wZoom" hidden>
        <div id="wZoomBar">
          <button id="wZoomClose">close</button>
        </div>
        <div id="wZoomBody"></div>
      </div>
    </div>
  </div>
</div>

<script src="/drive_world.js"></script>
<script src="/drive_web.js"></script>
</body>
</html>
